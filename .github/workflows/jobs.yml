name: Jobs

# Tác vụ vận hành trên production (đặc tả mục 6). Lịch đặt mỗi giờ, nhưng thực tế GitHub chạy thưa và lệch giờ thất
# thường (có ngày chỉ 4–8 tiếng một lần), nên mỗi lần chạy làm đủ 4 tác vụ và hai tác vụ sao lưu tự tính hạn theo
# bản sao lưu thật trong kho (`--if-due`), không theo giờ chạy:
#   purge_accounts, purge_trash   mỗi lần chạy (rẻ, chạy lại không sao)
#   backup_db --if-due            khi bản DB mới nhất cũ hơn BACKUP_DB_INTERVAL_HOURS (mặc định 8 giờ)
#   backup_photos --if-due        khi lượt sao lưu ảnh gần nhất cũ hơn BACKUP_PHOTOS_INTERVAL_HOURS (mặc định 24 giờ)
# Repo công khai không có commit 60 ngày thì GitHub tự tắt lịch (bật lại ở tab Actions).
# Chạy tay: Actions → Jobs → Run workflow; chọn một tác vụ cụ thể thì chạy ngay, không xét hạn.
# Khóa đặt ở Settings → Secrets and variables → Actions (danh sách ở env bên dưới).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Tác vụ (auto = như lịch, sao lưu chỉ chạy khi đến hạn)
        type: choice
        default: auto
        options: [auto, purge_accounts, purge_trash, backup_db, backup_photos]

permissions:
  contents: read

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'Nha-Cong-Dong/DailyDiary'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      # Action ghim theo commit SHA (workflow này cầm khóa production): tag có thể bị dời, SHA thì không.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install 3.12 && uv sync --locked --no-dev

      - name: Chọn tác vụ
        id: pick
        env:
          ASKED: ${{ inputs.task || 'auto' }}
        run: |
          if [ "$ASKED" != "auto" ]; then
            tasks="$ASKED"
            if_due=""
          else
            tasks="purge_accounts purge_trash backup_db backup_photos"
            if_due="--if-due"
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "if_due=$if_due" >> "$GITHUB_OUTPUT"
          echo "Tác vụ: $tasks ${if_due:+(sao lưu: $if_due)}"

      # Chạy hết các tác vụ đã chọn rồi mới báo lỗi, để một tác vụ hỏng không chặn tác vụ khác (vd sao lưu).
      # Khóa production chỉ có ở bước này, các bước cài đặt phía trên không thấy.
      - name: Chạy
        env:
          TASKS: ${{ steps.pick.outputs.tasks }}
          IF_DUE: ${{ steps.pick.outputs.if_due }}
          ENV: production
          PYTHONUTF8: "1"
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: dailydiary
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: auto
          S3_BUCKET: jotly-photos
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          BACKUP_S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_STARTTLS: "true"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          FEEDBACK_TO_EMAIL: ${{ secrets.FEEDBACK_TO_EMAIL }}
        run: |
          failed=""
          for t in $TASKS; do
            extra=""
            case "$t" in backup_*) extra="$IF_DUE" ;; esac
            echo "::group::$t"
            # shellcheck disable=SC2086 # $extra cố ý không ngoặc kép: rỗng thì không truyền đối số nào
            uv run --no-dev python -m app.jobs.run "$t" $extra || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Lỗi:$failed"; exit 1; fi
